name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          install: true

      - name: Type check
        run: pnpm check

      - name: Knip
        run: pnpm knip

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check
